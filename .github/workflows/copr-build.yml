name: Bump spec to upstream release and build in COPR

on:
  schedule:
    # Check daily for new upstream releases
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Trigger a COPR build even if the spec is already current
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: Umio-Yasuno/amdgpu_top
  SPEC: amdgpu_top.spec
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  bump-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare spec version with latest upstream release
        id: check
        run: |
          LATEST=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name | sed 's/^v//')
          CURRENT=$(awk '/^Version:/ {print $2; exit}' "$SPEC")
          echo "upstream=$LATEST spec=$CURRENT"
          if [ -z "$LATEST" ]; then
            echo "::error::Could not read latest upstream release"
            exit 1
          fi
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Already at $CURRENT, nothing to do"
          else
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Update spec, commit and push
        if: steps.check.outputs.version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          sed -i -E "s/^(Version:[[:space:]]*).*/\1$VERSION/; s/^(Release:[[:space:]]*)[0-9]+/\11/" "$SPEC"
          sed -i "/^%changelog/a * $(date '+%a %b %d %Y') Petar Sredojevic <petar@sredojevic.ca> - $VERSION-1\n- Update to upstream $VERSION (automated)\n" "$SPEC"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update amdgpu_top to $VERSION"
          git push

      - name: Trigger COPR build
        if: steps.check.outputs.version || inputs.force_build
        env:
          COPR_WEBHOOK: ${{ secrets.COPR_WEBHOOK }}
        run: curl --fail --silent --show-error -X POST "$(printf '%s' "$COPR_WEBHOOK" | tr -d '[:space:]')"

      # Scheduled workflows get disabled after 60 days without repo activity;
      # re-enabling on every run resets that timer.
      - name: Keepalive
        if: always()
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/copr-build.yml/enable"
